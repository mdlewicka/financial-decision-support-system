[project]
name = "financial-decision-support-system"
version = "0.1.0"
description = "AI-powered financial decision support system."
readme = "README.md"
requires-python = ">=3.12,<3.13"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    ".venv",
    "data",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = [
    "E402",
    "F401",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
