name: Continuous integration

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Ruff quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - name: Install pinned Ruff
        run: python -m pip install --no-deps ruff==0.16.1

      - name: Run lint checks
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

  tests:
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python with dependency cache
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install pinned project and test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run non-RL regression suite
        run: >-
          python -m pytest tests -q
          --ignore=tests/rl
          --ignore=tests/integration/test_rl_allocation_workflow_integration.py
          --ignore=tests/integration/test_portfolio_allocation_env_integration.py

      - name: Run isolated RL regression suite
        run: >-
          python -m pytest
          tests/rl
          tests/integration/test_rl_allocation_workflow_integration.py
          tests/integration/test_portfolio_allocation_env_integration.py
          -q

  containers:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build local application images
        run: docker compose build

      - name: Start and verify local application stack
        run: |
          trap 'docker compose down --volumes' EXIT
          docker compose up --detach --wait --wait-timeout 180
          docker compose ps
          curl --fail --show-error http://127.0.0.1:8000/api/v1/system/liveness
          curl --fail --show-error http://127.0.0.1:8000/api/v1/system/readiness
          curl --fail --show-error http://127.0.0.1:8501/_stcore/health
